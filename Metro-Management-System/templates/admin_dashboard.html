{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Admin Dashboard</h2>

<div class="row">

<div class="col-md-3">
<div class="card text-center bg-primary text-white mb-3">
<div class="card-body">
<h5>Total Passengers</h5>
<h2>{{ total_passengers }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-success text-white mb-3">
<div class="card-body">
<h5>Total Stations</h5>
<h2>{{ total_stations }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-warning text-white mb-3">
<div class="card-body">
<h5>Total Trains</h5>
<h2>{{ total_trains }}</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-danger text-white mb-3">
<div class="card-body">
<h5>Total Bookings</h5>
<h2>{{ total_bookings }}</h2>
</div>
</div>
</div>

</div>

<div class="mt-4">

<a href="/stations" class="btn btn-primary">Manage Stations</a>

<a href="/trains" class="btn btn-success">Manage Trains</a>

<a href="/schedules" class="btn btn-warning">Manage Schedule</a>

<a href="/logout" class="btn btn-danger">Logout</a>

</div>

{% endblock %}
