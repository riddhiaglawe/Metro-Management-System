{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>🚇 Passenger Dashboard</h3>
        </div>

        <div class="card-body">

            <h4 class="mb-4">
                Welcome,
                <span class="text-primary">
                    {{ passenger }}
                </span>
            </h4>

            <form action="/search" method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Source Station
                    </label>

                    <select
                        class="form-select"
                        name="source"
                        required>

                        <option value="">
                            Select Source Station
                        </option>

                        {% for station in stations %}

                        <option value="{{ station.station_name }}">
                            {{ station.station_name }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Destination Station
                    </label>

                    <select
                        class="form-select"
                        name="destination"
                        required>

                        <option value="">
                            Select Destination Station
                        </option>

                        {% for station in stations %}

                        <option value="{{ station.station_name }}">
                            {{ station.station_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Journey Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="journey_date"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">

                    🔍 Search Metro

                </button>

            </form>

            <hr>

            <div class="d-flex justify-content-center gap-3">

                <a
                    href="/booking_history"
                    class="btn btn-primary">

                    📜 Booking History

                </a>

                <a
                    href="/logout"
                    class="btn btn-danger">

                    🚪 Logout

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
