{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white">

<h2 class="mb-0">

💳 Complete Your Payment

</h2>

</div>

<div class="card-body p-4">

<div class="alert alert-info">

<h4>{{ plan.name }}</h4>

<h2 class="text-success">

₹ {{ plan.amount }}

</h2>

</div>

<h5 class="mb-3">

Select Payment Method

</h5>

<div class="row g-3 mb-4">

<div class="col-md-4">

<button class="btn btn-outline-primary w-100"
onclick="showUPI()">

📱 UPI

</button>

</div>

<div class="col-md-4">

<button class="btn btn-outline-success w-100"
onclick="showCard()">

💳 Debit / Credit Card

</button>

</div>

<div class="col-md-4">

<button class="btn btn-outline-warning w-100"
onclick="showQR()">

📷 QR Code

</button>

</div>

<div class="col-md-6">

<button class="btn btn-outline-info w-100 mt-3"
onclick="showBank()">

🏦 Net Banking

</button>

</div>

<div class="col-md-6">

<button class="btn btn-outline-dark w-100 mt-3"
onclick="showWallet()">

👛 Wallet

</button>

</div>

</div>

<div id="paymentForm">

<p class="text-center text-muted">

Please select a payment method.

</p>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

function showUPI(){

document.getElementById("paymentForm").innerHTML=`

<h4>UPI Payment</h4>

<input class="form-control mb-3"
placeholder="Enter UPI ID">

<div class="d-grid gap-2">

<button class="btn btn-primary">

Google Pay

</button>

<button class="btn btn-success">

PhonePe

</button>

<button class="btn btn-info">

Paytm

</button>

</div>

<a href="/payment_success"

class="btn btn-dark mt-4 w-100">

Pay ₹ {{ plan.amount }}

</a>

`;

}

function showCard(){

document.getElementById("paymentForm").innerHTML=`

<h4>Debit / Credit Card</h4>

<input class="form-control mb-3"
placeholder="Card Number">

<input class="form-control mb-3"
placeholder="Card Holder Name">

<div class="row">

<div class="col">

<input class="form-control"
placeholder="MM/YY">

</div>

<div class="col">

<input class="form-control"
placeholder="CVV">

</div>

</div>

<a href="/payment_success"

class="btn btn-success mt-4 w-100">

Pay ₹ {{ plan.amount }}

</a>

`;

}

function showQR(){

document.getElementById("paymentForm").innerHTML=`

<h4>Scan QR Code</h4>

<img
src="{{ url_for('static', filename='images/payment_qr.png') }}"
class="img-fluid mb-3"
style="max-width:250px;">

<a href="/payment_success"

class="btn btn-primary w-100">

I Have Paid

</a>

`;

}

function showBank(){

document.getElementById("paymentForm").innerHTML=`

<h4>Net Banking</h4>

<select class="form-select mb-3">

<option>SBI</option>

<option>HDFC</option>

<option>ICICI</option>

<option>Axis Bank</option>

<option>Bank of Baroda</option>

</select>

<a href="/payment_success"

class="btn btn-warning w-100">

Proceed

</a>

`;

}

function showWallet(){

document.getElementById("paymentForm").innerHTML=`

<h4>Wallet Payment</h4>

<select class="form-select mb-3">

<option>Amazon Pay</option>

<option>Paytm Wallet</option>

<option>Mobikwik</option>

<option>Freecharge</option>

</select>

<a href="/payment_success"

class="btn btn-dark w-100">

Pay ₹ {{ plan.amount }}

</a>

`;

}

</script>

{% endblock %}
